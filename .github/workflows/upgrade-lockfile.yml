# Temporary workflow for generating a correct npm lockfile on this upgrade branch.
# Delete this file once package-lock.json has been committed.
name: Generate Astro 7 lockfile (temporary)

on:
  push:
    branches:
      - chore/upgrade-astro-v7-20261102

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and build
        run: |
          npm ci
          npm run build
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile for Astro 7"
          git push
